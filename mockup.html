<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Planner Mockup</title>

<style>
/* ==========================================================================
   Obsidian stand-ins.
   The plugin's stylesheet below uses nothing but Obsidian's own CSS variables,
   so a mockup only has to supply those. Values are Obsidian's defaults for the
   stock light and dark themes.
   ========================================================================== */

.ob {
	--font-ui-small: 13px;
	--font-ui-smaller: 12px;
	--font-monospace: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	--radius-s: 4px;
	--radius-m: 8px;
	--shadow-s: 0 1px 4px rgba(0, 0, 0, 0.15);
}

.ob.theme-light {
	--background-primary: #ffffff;
	--background-secondary: #f6f6f6;
	--background-modifier-hover: rgba(0, 0, 0, 0.055);
	--background-modifier-border: #e0e0e0;
	--background-modifier-border-focus: #b4b4b4;
	--text-normal: #222222;
	--text-muted: #6e6e6e;
	--text-faint: #999999;
	--text-accent: #705dcf;
	--text-error: #e75545;
	--text-on-accent: #ffffff;
	--interactive-accent: #7c6cdb;
	--checklist-done-color: #9b9b9b;
}

.ob.theme-dark {
	--background-primary: #1e1e1e;
	--background-secondary: #161616;
	--background-modifier-hover: rgba(255, 255, 255, 0.075);
	--background-modifier-border: #333333;
	--background-modifier-border-focus: #555555;
	--text-normal: #dadada;
	--text-muted: #b3b3b3;
	--text-faint: #666666;
	--text-accent: #a493ef;
	--text-error: #ff3333;
	--text-on-accent: #ffffff;
	--interactive-accent: #7c6cdb;
	--checklist-done-color: #6e6e6e;
}

/* Obsidian's icon convention: Lucide strokes that take the current colour. */
.ob .svg-icon {
	width: 16px;
	height: 16px;
	stroke: currentColor;
	fill: none;
	stroke-width: 2;
	stroke-linecap: round;
	stroke-linejoin: round;
}

/*
 * Obsidian styles checkboxes itself and sizes them off --checkbox-size, which
 * is how the band chips shrink theirs to 11px. Approximated here with the
 * native control so the mockup needs no images.
 */
.ob input[type="checkbox"] {
	--checkbox-size: 16px;
	width: var(--checkbox-size);
	height: var(--checkbox-size);
	accent-color: var(--interactive-accent);
}


/* ==========================================================================
   Mockup page chrome — not part of the plugin.
   ========================================================================== */

body {
	margin: 0;
	padding: 40px 32px 56px;
	background: #eceff3;
	color: #24292f;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
		Roboto, sans-serif;
	font-size: 14px;
	line-height: 1.6;
}

.page {
	max-width: 1000px;
	margin: 0 auto;
}

h1 {
	margin: 0 0 4px;
	font-size: 22px;
	letter-spacing: -0.01em;
}

.lede {
	margin: 0 0 32px;
	color: #57606a;
	max-width: 62ch;
}

.frames {
	display: flex;
	flex-wrap: wrap;
	gap: 28px;
}

figure {
	margin: 0;
}

figcaption {
	margin-bottom: 8px;
	color: #57606a;
	font-size: 12px;
	font-weight: 600;
	letter-spacing: 0.06em;
	text-transform: uppercase;
}

/* The sidebar itself: Obsidian's default right-panel width. */
.frame {
	width: 300px;
	border-radius: 10px;
	background: var(--background-primary);
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 8px 24px rgba(0, 0, 0, 0.11);
	overflow: hidden;
}

.frame.is-narrow {
	width: 232px;
}

.note {
	margin: 30px 0 0;
	padding: 14px 16px;
	border-left: 3px solid #b9c0c8;
	background: #f6f8fa;
	color: #57606a;
	font-size: 13px;
}

.note code {
	font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	font-size: 12px;
}
</style>


<style>
/* ==========================================================================
   styles.css — verbatim copy, injected at build time. Do not edit here.
   ========================================================================== */

/* Calendar Planner — sidebar calendar styles. Obsidian CSS variables only. */

.calendar-planner {
	--cp-font-small: var(--font-ui-small);
	--cp-font-smaller: calc(var(--font-ui-smaller) * 0.96);
	--cp-num-font: calc(var(--cp-font-small) * 0.94);
	--cp-ease: 130ms ease;
	position: relative;
	padding: 12px 14px 18px;
	color: var(--text-muted);
	font-size: var(--cp-font-small);
	text-transform: uppercase;
	-webkit-user-select: none;
	user-select: none;
}

/* .calendar-planner sits on .view-content, whose padding Obsidian core and
   themes set at matching specificity — anchor to the leaf so this wins. */
.workspace-leaf-content[data-type="calendar-planner-view"] .calendar-planner {
	padding: 12px 14px 18px;
}


/* ========================================================================
   Header
   ======================================================================== */

.calendar-planner .cp-header {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	justify-content: space-between;
	gap: 8px 12px;
	padding: 0;
	margin: 4px 0 18px;
}

.calendar-planner .cp-title {
	display: flex;
	align-items: baseline;
	gap: 7px;
	color: var(--text-normal);
	font-size: 1.35em;
	line-height: 1.2;
	letter-spacing: -0.01em;
	text-transform: none;
}

.calendar-planner .cp-month {
	font-size: 1.3em;
	font-weight: 650;
	color: var(--interactive-accent);
}

.calendar-planner .cp-year {
	font-size: 1.3em;
	font-weight: 600;
	color: var(--text-muted);
	margin-right: 1px;
}

.calendar-planner .cp-title-part {
	display: flex;
	align-items: baseline;
	gap: 1px;
}

.calendar-planner .cp-title .is-link {
	cursor: pointer;
	border-radius: var(--radius-s);
	padding: 0 3px;
	margin: 0 -3px;
	transition: background-color var(--cp-ease), box-shadow var(--cp-ease);
}

.calendar-planner .cp-title .is-link:hover {
	background-color: var(--background-modifier-hover);
}

.calendar-planner .cp-title .is-link.is-active {
	background-color: var(--background-modifier-hover);
	box-shadow: inset 0 0 0 1px var(--interactive-accent);
}

.calendar-planner .cp-pick {
	display: inline-flex;
	align-items: center;
	align-self: center;
	justify-content: center;
	padding: 1px;
	border-radius: var(--radius-s);
	color: var(--text-faint);
	cursor: pointer;
	transition: background-color var(--cp-ease), color var(--cp-ease);
}

.calendar-planner .cp-pick:hover {
	background-color: var(--background-modifier-hover);
	color: var(--text-normal);
}

.calendar-planner .cp-pick .svg-icon {
	width: 14px;
	height: 14px;
}

.calendar-planner .cp-title .is-link:focus-visible,
.calendar-planner .cp-pick:focus-visible {
	outline: 1px solid var(--background-modifier-border-focus);
	outline-offset: 1px;
}


/* ------------------------------------------------------------------------
   Month / Year grid picker
   ------------------------------------------------------------------------ */

.calendar-planner .cp-picker {
	position: absolute;
	z-index: 30;
	width: max-content;
	max-width: calc(100% - 20px);
	padding: 8px;
	border: 1px solid var(--background-modifier-border);
	border-radius: var(--radius-m);
	background: var(--background-primary);
	box-shadow: var(--shadow-l);
}

.calendar-planner .cp-picker-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	margin-bottom: 5px;
	padding: 0 2px;
}

.calendar-planner .cp-picker-range {
	color: var(--text-normal);
	font-size: var(--cp-font-small);
	font-weight: 600;
}

.calendar-planner .cp-picker-nav {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 22px;
	height: 22px;
	padding: 0;
	border: none;
	border-radius: var(--radius-s);
	background: transparent;
	color: var(--text-muted);
	cursor: pointer;
	transition: background-color var(--cp-ease), color var(--cp-ease);
}

.calendar-planner .cp-picker-nav:hover {
	background-color: var(--background-modifier-hover);
	color: var(--text-normal);
}

.calendar-planner .cp-picker-nav .svg-icon {
	width: 15px;
	height: 15px;
}

.calendar-planner .cp-picker-grid {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: 3px;
}

.calendar-planner .cp-picker-cell {
	padding: 7px 8px;
	border: none;
	border-radius: var(--radius-s);
	background: transparent;
	color: var(--text-normal);
	font-size: var(--cp-font-smaller);
	font-weight: 550;
	line-height: 1.2;
	letter-spacing: 0;
	text-transform: none;
	cursor: pointer;
	transition: background-color var(--cp-ease), color var(--cp-ease);
}

.calendar-planner .cp-picker-cell:hover {
	background-color: var(--background-modifier-hover);
}

.calendar-planner .cp-picker-cell.is-today {
	color: var(--interactive-accent);
}

.calendar-planner .cp-picker-cell.is-current {
	background-color: var(--interactive-accent);
	color: var(--text-on-accent);
}

.calendar-planner .cp-nav {
	display: flex;
	align-items: center;
	flex: none;
	margin-right: -2px;
	color: var(--text-muted);
	font-size: var(--cp-font-smaller);
	font-weight: 600;
	letter-spacing: 0.06em;
}

.calendar-planner .cp-nav-btn {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 2px;
	border-radius: var(--radius-s);
	cursor: pointer;
	transition: background-color var(--cp-ease), color var(--cp-ease);
}

.calendar-planner .cp-nav-today {
	padding: 2px 5px;
}

.calendar-planner .cp-nav-btn:hover {
	background-color: var(--background-modifier-hover);
	color: var(--text-normal);
}

.calendar-planner .cp-nav-btn .svg-icon {
	width: 21px;
	height: 21px;
	stroke-width: 2.8px;
}


/* ========================================================================
   Calendar Grid
   ======================================================================== */

.calendar-planner .cp-grid {
	--cp-weeknum-max: calc(1.75em + var(--cp-font-smaller) * 1.5);
	--cp-weeknum-w: min(var(--cp-weeknum-max), 10.5%);
	--cp-weeknum-gutter: 20%;
	display: grid;
	grid-template-columns: repeat(7, minmax(0, 1fr));
	gap: 3px 2px;
	text-align: center;
	align-items: start;
}

.calendar-planner .cp-grid.has-weeknum {
	grid-template-columns: var(--cp-weeknum-w) repeat(7, minmax(0, 1fr));
}

.calendar-planner .cp-weekhead-w {
	padding-right: var(--cp-weeknum-gutter);
}


/* ------------------------------------------------------------------------
   Weekday header
   ------------------------------------------------------------------------ */

.calendar-planner .cp-weekhead {
	padding-bottom: 8px;
	color: var(--text-faint);
	font-size: calc(var(--cp-font-smaller) * 0.92);
	font-weight: 600;
	letter-spacing: 0.08em;
	line-height: 1;
}

.calendar-planner .cp-weekhead.is-sat {
	color: var(--cp-sat-color, var(--text-faint));
}

.calendar-planner .cp-weekhead.is-sun {
	color: var(--cp-sun-color, var(--text-faint));
}


/* ------------------------------------------------------------------------
   Week number
   ------------------------------------------------------------------------ */

.calendar-planner .cp-weeknum {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	box-sizing: border-box;
	height: calc(var(--cp-num-font) * 3);
	padding: 3px var(--cp-weeknum-gutter) 3px 0;
	color: var(--text-faint);
	font-size: var(--cp-num-font);
	line-height: 1;
}

.calendar-planner .cp-grid.has-weeknum {
	position: relative;
}

.calendar-planner .cp-grid.has-weeknum::before {
	content: "";
	position: absolute;
	top: 0;
	bottom: 0;
	left: calc(var(--cp-weeknum-w) + 1px);
	width: 1px;
	background-color: var(--background-modifier-border);
	pointer-events: none;
}

.calendar-planner .cp-weeknum.is-clickable {
	cursor: pointer;
}

.calendar-planner .cp-weeknum.is-clickable:hover {
	color: var(--text-normal);
}

.calendar-planner .cp-weeknum.is-today-week .cp-weeknum-num {
	color: var(--interactive-accent);
	font-weight: 700;
}

.calendar-planner .cp-weeknum.is-current .cp-weeknum-num {
	background-color: var(--background-modifier-hover);
	box-shadow: inset 0 0 0 1px var(--interactive-accent);
	color: var(--text-normal);
}

.calendar-planner .cp-weeknum.is-today-week.is-current .cp-weeknum-num {
	background-color: var(--interactive-accent);
	box-shadow: none;
	color: var(--text-on-accent);
	font-weight: 700;
}


/* ========================================================================
   Day Cell
   ======================================================================== */

.calendar-planner .cp-day {
	position: relative;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	box-sizing: border-box;
	height: calc(var(--cp-num-font) * 3);
	padding: 3px 0;
	color: var(--text-normal);
	font-size: var(--cp-num-font);
	line-height: 1;
	cursor: pointer;
}


/* ------------------------------------------------------------------------
   Number boxes
   ------------------------------------------------------------------------ */

.calendar-planner .cp-weeknum-num,
.calendar-planner .cp-day-num {
	flex: none;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 1.7em;
	height: 1.7em;
	max-width: 100%;
	border-radius: 32%;
	line-height: 1;
	transition: background-color var(--cp-ease), color var(--cp-ease),
		box-shadow var(--cp-ease);
}


/* ------------------------------------------------------------------------
   Day states
   ------------------------------------------------------------------------ */

.calendar-planner .cp-day:hover .cp-day-num {
	background-color: var(--background-modifier-hover);
}

.calendar-planner .cp-day.is-outside .cp-day-num {
	color: var(--text-faint);
}

.calendar-planner .cp-day.is-today .cp-day-num {
	color: var(--interactive-accent);
	font-weight: 700;
}

.calendar-planner .cp-day.is-selected .cp-day-num {
	background-color: var(--background-modifier-hover);
	box-shadow: inset 0 0 0 1px var(--interactive-accent);
	color: var(--text-normal);
}

.calendar-planner .cp-day.is-today.is-selected .cp-day-num {
	background-color: var(--interactive-accent);
	box-shadow: none;
	color: var(--text-on-accent);
	font-weight: 700;
}


/* ========================================================================
   Note marker
   ======================================================================== */

.calendar-planner .cp-marker {
	flex: none;
	width: 0.5em;
	height: 1.8px;
	margin-top: 3px;
	border-radius: 1px;
	background-color: var(--text-faint);
}


/* ========================================================================
   Day preview bands
   ======================================================================== */

.calendar-planner .cp-grid.has-preview {
	--cp-band-font: calc(var(--cp-font-smaller) * 0.82);
	--cp-band-h: calc(var(--cp-band-font) * 1.4 + 4px);
	--cp-band-gap: 3px;
	--cp-day-slots: 3;
	--cp-preview-h: calc(
		var(--cp-day-slots) * var(--cp-band-h) +
			(var(--cp-day-slots) - 1) * var(--cp-band-gap)
	);
	--cp-marker-slot: 5px;
	--cp-day-h: calc(
		var(--cp-num-font) * 1.9 + var(--cp-marker-slot) +
			var(--cp-preview-h) + 4px
	);
	row-gap: 5px;
}

.calendar-planner .cp-grid.has-preview .cp-day {
	justify-content: flex-start;
	height: var(--cp-day-h);
	min-width: 0;
	padding: 3px 1px 4px;
}

.calendar-planner .cp-grid.has-preview .cp-weeknum {
	justify-content: flex-start;
	height: var(--cp-day-h);
	padding: 3px var(--cp-weeknum-gutter) 4px 0;
}

.calendar-planner .cp-grid.has-preview .cp-marker {
	margin-bottom: 0;
}

.calendar-planner .cp-day-preview {
	display: flex;
	flex-direction: column;
	gap: var(--cp-band-gap);
	width: 100%;
	min-width: 0;
	height: var(--cp-preview-h);
	margin-top: -2px;
	overflow: hidden;
	z-index: 1000;
}

.calendar-planner .cp-band {
	display: flex;
	align-items: center;
	box-sizing: border-box;
	flex: none;
	gap: 3px;
	min-width: 0;
	height: var(--cp-band-h);
	padding: 1px 4px;
	border-radius: 3px;
	background-color: var(--background-modifier-hover);
	overflow: hidden;
	transition: background-color var(--cp-ease);
}

.calendar-planner .cp-band-check {
	--checkbox-size: 11px;
	flex: none;
	top: 0;
	margin: 0;
}

.calendar-planner .cp-band-check:not(:disabled) {
	cursor: pointer;
}

.calendar-planner .cp-band-text {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	color: var(--text-normal);
	font-size: var(--cp-band-font);
	line-height: 1.4;
	white-space: nowrap;
	text-align: left;
	text-transform: none;
}

.calendar-planner.cp-band-fade .cp-band-text {
	-webkit-mask-image: linear-gradient(
		to right,
		#000 calc(100% - 12px),
		transparent 100%
	);
	mask-image: linear-gradient(
		to right,
		#000 calc(100% - 12px),
		transparent 100%
	);
}

.calendar-planner .cp-band.is-done .cp-band-text {
	color: var(--checklist-done-color, var(--text-muted));
}

.calendar-planner.cp-done-strike .cp-band.is-done .cp-band-text {
	text-decoration: line-through;
}

.calendar-planner .cp-band-more {
	display: flex;
	align-items: center;
	box-sizing: border-box;
	flex: none;
	height: var(--cp-band-h);
	padding: 0 4px;
	color: var(--text-faint);
	font-size: var(--cp-band-font);
	line-height: 1.4;
	text-align: left;
	cursor: default;
}

.calendar-planner .cp-band-more:hover {
	color: var(--text-muted);
}


/* ========================================================================
   Divider + Bottom Detail Panel
   ======================================================================== */

.calendar-planner .cp-divider {
	height: 1px;
	margin: 18px 0 16px;
	background-color: var(--background-modifier-border);
}

.calendar-planner .cp-panel-empty {
	padding: 28px 12px;
	color: var(--text-faint);
	font-size: var(--cp-font-smaller);
	line-height: 1.5;
	text-align: center;
}


/* ========================================================================
   Panel Header
   ======================================================================== */

.calendar-planner .cp-panel-head {
	display: flex;
	flex-wrap: wrap;
	align-items: baseline;
	justify-content: space-between;
	gap: 2px 10px;
	margin-bottom: 16px;
}

.calendar-planner .cp-panel-title {
	color: var(--text-normal);
	font-size: 1.25em;
	font-weight: 650;
	line-height: 1.25;
	letter-spacing: -0.01em;
	text-transform: none;
}

.calendar-planner .cp-panel-title.is-link {
	cursor: pointer;
	transition: color var(--cp-ease);
}

.calendar-planner .cp-panel-title.is-link:hover {
	color: var(--interactive-accent);
}

.calendar-planner .cp-panel-sub {
	flex: none;
	color: var(--text-muted);
	font-size: var(--cp-font-smaller);
	letter-spacing: 0.02em;
}

.calendar-planner .cp-panel-sub.is-link {
	cursor: pointer;
	transition: color var(--cp-ease);
}

.calendar-planner .cp-panel-sub.is-link:hover {
	color: var(--text-normal);
}


/* ========================================================================
   Panel Sections
   ======================================================================== */

.calendar-planner .cp-section {
	margin-top: 20px;
}

.calendar-planner .cp-section:first-of-type {
	margin-top: 0;
}

.calendar-planner .cp-section-head {
	display: flex;
	align-items: center;
	gap: 5px;
	margin-bottom: 8px;
}

.calendar-planner .cp-section-toggle {
	display: inline-flex;
	flex: none;
	color: var(--text-faint);
	cursor: pointer;
	transition: transform var(--cp-ease), color var(--cp-ease);
}

.calendar-planner .cp-section.is-collapsed .cp-section-toggle {
	transform: rotate(-90deg);
}

.calendar-planner .cp-section-toggle .svg-icon {
	width: 13px;
	height: 13px;
}

.calendar-planner .cp-section-label {
	color: var(--text-muted);
	font-size: calc(var(--cp-font-smaller) * 0.96);
	font-weight: 600;
	letter-spacing: 0.08em;
}

.calendar-planner .cp-section-head.is-foldable .cp-section-label {
	cursor: pointer;
}

.calendar-planner .cp-section-head.is-foldable .cp-section-toggle:hover,
.calendar-planner .cp-section-head.is-foldable .cp-section-label:hover {
	color: var(--text-normal);
}

.calendar-planner .cp-section.is-collapsed .cp-items,
.calendar-planner .cp-section.is-collapsed .cp-section-empty,
.calendar-planner .cp-section.is-collapsed .cp-memo-body {
	display: none;
}

.calendar-planner .cp-section-add {
	display: inline-flex;
	flex: none;
	margin-left: auto;
	padding: 2px;
	border-radius: var(--radius-s);
	color: var(--text-faint);
	cursor: pointer;
	transition: background-color var(--cp-ease), color var(--cp-ease);
}

.calendar-planner .cp-section-add:hover {
	background-color: var(--background-modifier-hover);
	color: var(--text-normal);
}

.calendar-planner .cp-section-add .svg-icon {
	width: 13px;
	height: 13px;
}

.calendar-planner .cp-section-empty {
	padding: 2px 0;
	color: var(--text-faint);
	font-size: var(--cp-font-smaller);
}


/* ========================================================================
   Panel Items
   ======================================================================== */

.calendar-planner .cp-items {
	display: flex;
	flex-direction: column;
	gap: 1px;
}

.calendar-planner .cp-item {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	padding: 4px 6px;
	margin: 0 -6px;
	color: var(--text-normal);
	font-size: var(--cp-font-small);
	line-height: 1.5;
